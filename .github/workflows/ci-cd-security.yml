name: CI CD Security Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  security-events: write

jobs:
  backend-tests-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Bandit Python SAST
        working-directory: backend
        run: bandit -r . -x tests -ll

  frontend-build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: NPM dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v2

  docker-build-and-scan:
    runs-on: ubuntu-latest
    needs: [backend-tests-and-sast, frontend-build-and-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t devsecops-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t devsecops-frontend:ci ./frontend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
